<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/icon-512.png">
<title>100均アプリ — 自分（開発者）なら100円以上でも払うものを作りました</title>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --primary: #2d5a27;
    --primary-dark: #16300f;
    --accent: #e8a020;
    --text: #1a1a18;
    --muted: #6b6b66;
    --border: #e0ddd6;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    padding-top: 52px;
    height: 100vh;   /* dvh非対応ブラウザ用フォールバック */
    height: 100dvh;
    /* iOSのアドレスバー表示/非表示でdvhの更新が取りこぼされると、画面下部に
       恒久的な空白ができる。JSが実測値(innerHeight)を--app-heightで供給し、
       resize系イベントで追従させる(下のrefitViewport参照) */
    height: var(--app-height, 100dvh);
    overflow: hidden;               /* 縦スクロールは各ページ内部で行う */
    display: flex; flex-direction: column;
  }

  /* Header */
  header {
    background: var(--primary);
    padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 52px;
  }
  header h1 {
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.06em;
    border: 2px solid #fff;
    padding: 3px 14px; border-radius: 6px;
    white-space: nowrap; flex-shrink: 0;
    /* ダブルタップでトップへ戻る操作用（ダブルタップズームと選択を無効化） */
    cursor: pointer;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .visitor-count {
    font-size: 16px;
    font-weight: 700;
    color: #ffe033;
    white-space: nowrap;
  }
  /* 詳細モーダル表示中は「来店者数」の代わりに戻り方のヒントを出す */
  .modal-hint {
    display: none;
    font-size: 13px;
    font-weight: 700;
    color: #ffe033;
    white-space: nowrap;
  }
  body.modal-open .visitor-count { display: none; }
  body.modal-open .modal-hint { display: inline; }
  /* 詳細ページ表示中は「100均アプリ」バッジを「詳細ページ」表示に切替(赤地・太枠) */
  body.modal-open header h1 {
    background: #c62828;
    border: 3px solid #fff;
    color: #fff;
    font-weight: 700;
  }

  /* トップバー直下の小さな煽り文 */
  .sub-tagline {
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.6;
    color: var(--muted);
    /* 左paddingは58px（#prevBtnの円が left:6px 幅44px=右端50pxまで張り出すため、8px余白を足した値） */
    padding: 8px 16px 8px 58px;
    background: var(--bg);
    flex: 0 0 auto;
  }

  /* ── 横ページャ（アプリ1つ=1ページ、CSSスクロールスナップ） ──
     ジェスチャー処理はブラウザネイティブに全面委譲する。
     縦横の軸判定・慣性・スナップはブラウザ標準動作（JSでのポインタ処理は行わない）。 */
  #pager {
    flex: 1 1 0; min-height: 0;
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;   /* 端での履歴戻りジェスチャー等への連鎖を抑止 */
    scrollbar-width: none;
  }
  #pager::-webkit-scrollbar { display: none; }
  /* 各アプリページ＝縦スナップコンテナ（紹介→詳細を縦1本でつなぐ） */
  .app-page {
    flex: 0 0 100%; width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;         /* 強いフリックでの複数ページ飛ばしを防ぐ */
    overflow-y: auto; overflow-x: hidden;
    scroll-snap-type: y mandatory;    /* 表紙（ヒーロー〜悩みごと〜CTA）のピタッと感。詳細は独立モーダル（.detail-modal）で自由スクロール */
    overscroll-behavior-y: contain;   /* ページ端でのpull-to-refresh等への連鎖を抑止 */
    display: flex; flex-direction: column;
  }
  .app-page > * { flex-shrink: 0; }
  /* margin-top: auto は近日公開ページ（内容が1画面未満）でfooterを最下部に押し下げる用。
     アプリの詳細footerはモーダル内スクロールの末尾にあり、スナップの影響を受けない */
  .app-page footer { margin-top: auto; }
  /* 縦スナップの吸着点（1画面ぴったりのセクション＋各セクション先頭）。
     紹介部分（悩みごと＋CTA）は .intro-scroll で1つのスナップ領域にまとめる：
     領域が1画面より大きい場合、領域内は自由スクロールでき、上端と下端
     （＝CTAが全部見える位置）が吸着点になる。 */
  .hero, .intro-scroll { scroll-snap-align: start; }
  /* 表紙の最終アンカー: CTAが全部見える位置（＝スクロール最下端ちょうど）を吸着点にする。
     end揃えなので端数ピクセルがあっても必ず到達できる */
  .detail-cta { scroll-snap-align: end; }

  /* ── 詳細モーダル ──
     詳細（ビューワー〜購入〜レビュー〜footer）は縦スナップの祖先を一切持たない
     独立した固定オーバーレイ。中身はただの overflow-y: auto なので、
     どの速さのスクロールでも好きな位置・末尾で確実に静止できる。
     （表紙スクローラーの子として持たせる構成は、iOSのmandatory再スナップが
       境界の揺らぎのたびに介入して末尾閲覧を壊すため全廃した） */
  .detail-modal {
    position: fixed; top: 52px; left: 0; right: 0;
    height: calc(var(--app-height, 100dvh) - 52px);
    z-index: 95;                       /* 矢印(90)より上・ヘッダー(100)より下 */
    background: var(--bg);
    transform: translateY(103%);
    visibility: hidden;
    transition: transform 0.3s ease, visibility 0.3s;
    display: flex; flex-direction: column;
  }
  .detail-modal.open { transform: translateY(0); visibility: visible; }
  .modal-scroll {
    flex: 1 1 0; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    overscroll-behavior-y: contain;    /* 背面へのスクロール連鎖を遮断 */
    touch-action: pan-y;               /* モーダル内タッチの横ぶれが横ページャに漏れないように */
  }
  .modal-close {
    position: absolute; top: 8px; right: 8px; z-index: 6;
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.85);
    background: rgba(45,90,39,0.92); color: #fff;
    font-size: 17px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    font-family: inherit;
  }

  /* ── PWAホーム画面追加の案内モーダル ──
     Safari（ホーム画面から起動していない場合のみ）で、ページ読み込みから
     3秒後に1回だけ表示。共有ボタンの位置に近い画面下部にシートとして出す。 */
  .pwa-guide-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.55);
    display: none; align-items: flex-end; justify-content: center;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .pwa-guide-overlay.open { display: flex; }
  .pwa-guide-card {
    background: var(--surface); color: var(--text);
    border-radius: 16px; padding: 24px 20px;
    width: 100%; max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .pwa-guide-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 18px; }
  .pwa-guide-step {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; line-height: 1.5; margin-bottom: 14px;
  }
  .pwa-guide-step-num {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .pwa-guide-icon { display: inline-block; vertical-align: -3px; color: var(--primary); }
  .pwa-guide-btn {
    display: block; width: 100%; padding: 13px; margin-top: 8px;
    border-radius: 8px; border: none; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .pwa-guide-btn:hover { background: #c98910; }

  /* ── 前後ページ移動の固定矢印 ──
     白地（煽り文エリア）のすぐ下＝緑地（ヒーロー）の上角に配置する */
  #pagerWrap {
    flex: 1 1 0; min-height: 0;
    position: relative;
    display: flex; flex-direction: column;
  }
  .pager-nav {
    /* 円(44px)の半分が白地(煽り文エリア)にかかる高さ。タイトル文字との重なり回避 */
    position: absolute; top: -22px;
    z-index: 90;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: none; background: none; cursor: pointer; padding: 0;
    font-family: inherit;
    transition: opacity 0.25s;
  }
  .pager-nav.hidden { opacity: 0; pointer-events: none; }
  .pager-nav .circle {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(45, 90, 39, 0.92); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; line-height: 1;
    padding-bottom: 3px;
    border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .pager-nav .nav-label {
    font-size: 10px; font-weight: 700; color: var(--primary);
    background: rgba(247,246,242,0.92);
    padding: 2px 6px; border-radius: 6px;
    white-space: nowrap;
  }
  #nextBtn { right: 6px; }
  #prevBtn { left: 6px; }

  /* ── ファーストビュー（雑誌の表紙のようなインパクト） ── */
  .hero {
    background: radial-gradient(circle at 50% 0%, #3d7536, var(--primary) 55%, var(--primary-dark));
    color: #fff;
    height: 100%;                     /* ページ（表示領域）ちょうどに収める */
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    text-align: center;
    padding: 28px 20px 60px;
    position: relative;
    overflow: hidden;
  }
  .hero-title {
    font-weight: 900;
    line-height: 1.2;
    max-width: 760px;
    margin-bottom: clamp(8px, 2vw, 12px);
  }
  .hero-title .line1 {
    display: block;
    width: 100%;
    text-align: left;
    padding-left: clamp(8px, 4vw, 24px);
    font-size: clamp(26px, 8vw, 44px);
    color: var(--accent);
    margin-bottom: 4px;
  }
  .hero-title .line2 {
    display: block;
    font-size: clamp(32px, 9vw, 60px);
  }
  .hero-catchbox {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: clamp(14px, 3.6vw, 18px);
    font-weight: 800;
    color: #fff;
    margin-bottom: clamp(10px, 2vw, 16px);
  }
  /* スクリーンショット：2枚同時表示・2枚ずつページ送り（CSSスクロールスナップ） */
  .hero-carousel {
    position: relative;
    width: clamp(240px, 84vw, 420px);
    margin: 0 auto clamp(8px, 2vw, 14px);
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .hero-carousel-viewport {
    overflow-x: auto; overflow-y: hidden;
    border-radius: 26px;
    flex: 1 1 0;
    min-height: 0;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;   /* カルーセル端でのスワイプが外側のページ送りへ連鎖しないようにする */
    scrollbar-width: none;
  }
  .hero-carousel-viewport::-webkit-scrollbar { display: none; }
  .hero-carousel-track {
    display: flex;
    height: 100%;
  }
  .hero-carousel-page {
    flex: 0 0 100%;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    gap: clamp(10px, 2.5vw, 18px);
    height: 100%;
  }
  .hero-screenshot {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    border-radius: 26px;
    background: linear-gradient(160deg, #1a1d24, #2d3748);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(36px, 9vw, 64px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35), 0 0 0 6px rgba(255,255,255,0.08);
    user-select: none;
    object-fit: cover;
  }
  /* topImages未設定アプリ用のプレースホルダー */
  .hero-noimage {
    flex: 1 1 0; min-height: 0;
    border-radius: 26px;
    background: linear-gradient(160deg, #1a1d24, #2d3748);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(36px, 9vw, 64px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35), 0 0 0 6px rgba(255,255,255,0.08);
  }
  .hero-dots {
    display: flex; justify-content: center; gap: 8px;
    margin-top: 10px;
    flex: 0 0 auto;
  }
  .hero-dots .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: none; padding: 0; cursor: pointer;
  }
  .hero-dots .dot.active { background: #fff; }
  .hero-ctas {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 420px;
    margin-top: auto;
  }
  .hero-btn {
    flex: 1 1 160px;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 15px; font-weight: 700;
    text-decoration: none;
    text-align: center;
    transition: transform 0.15s, opacity 0.15s;
  }
  .hero-btn:active { transform: scale(0.97); }
  .hero-btn.purchase { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(232,160,32,0.4); }
  .hero-btn.purchase:hover { opacity: 0.92; }
  .hero-btn.guest { background: rgba(255,255,255,0.08); color: #fff; border: 1.5px solid rgba(255,255,255,0.55); }
  .hero-btn.guest:hover { background: rgba(255,255,255,0.16); }

  .scroll-hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: rgba(255,255,255,0.65); font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    animation: bounce 1.8s infinite;
  }
  .scroll-hint svg { width: 18px; height: 18px; }
  @keyframes bounce {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 6px); }
  }

  /* ── 特徴セクション（スクロールで出現） ── */
  .features-section {
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
    padding: clamp(56px, 10vw, 110px) 20px clamp(20px, 4vw, 32px);
  }
  .features-section .section-label {
    text-align: center;
    font-size: clamp(28px, 7vw, 40px); font-weight: 900; color: var(--primary);
    letter-spacing: 0.04em; line-height: 1.3; margin-bottom: 40px;
    display: inline-block;
    background: linear-gradient(transparent 60%, #fde047 60%);
    padding: 0 16px;
  }
  .features-section .section-label-wrap {
    text-align: center;
  }
  .feature-item {
    display: flex; align-items: center; gap: 18px;
    padding: 26px 0;
    border-bottom: 0.5px solid var(--border);
    opacity: 0; transform: translateY(28px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .feature-item:last-child { border-bottom: none; }
  .feature-item.visible { opacity: 1; transform: translateY(0); }
  .feature-item .mark {
    flex-shrink: 0;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .feature-item .feature-text {
    font-size: clamp(15px, 3.6vw, 18px);
    font-weight: 700;
    line-height: 1.6;
  }

  /* ── 同期の強み ボックス ── */
  .sync-note {
    max-width: 560px;
    margin: clamp(18px, 3.5vw, 30px) auto 0;
    padding: clamp(18px, 4vw, 26px) clamp(20px, 4.5vw, 30px);
    border: 5px double var(--primary);
    border-radius: 14px;
    background: linear-gradient(135deg, #f4f9f2 0%, #e9f3e6 100%);
    text-align: left;
    font-size: clamp(15px, 3.6vw, 18px);
    font-weight: 700;
    line-height: 1.75;
    color: var(--primary);
    box-shadow: 0 4px 18px rgba(45, 90, 39, 0.10);
  }

  /* 緑枠直下の注意書き（本文より控えめ、ただしはっきり視認できる濃さ） */
  .privacy-caution {
    max-width: 560px;
    margin: 10px auto 0;
    padding: 0 12px;
    text-align: left;
    font-size: clamp(12px, 3.1vw, 14px);
    font-weight: 400;
    line-height: 1.7;
    color: #4d4d45;
  }

  /* ── 詳細への誘導CTA ── */
  .detail-cta {
    text-align: center;
    margin-top: clamp(20px, 4vw, 34px);
    padding: 0 20px clamp(36px, 6vw, 56px);
  }
  .detail-cta .price-line {
    font-size: 26px; font-weight: 900; margin-bottom: 6px;
  }
  .detail-cta .price-line span { font-size: 13px; color: var(--muted); font-weight: 400; }
  .detail-cta .cta-btn {
    display: inline-block; margin-top: 18px;
    background: var(--primary); color: #fff;
    padding: 16px 40px; border-radius: 10px;
    font-size: 15px; font-weight: 700; text-decoration: none;
    border: none; cursor: pointer; font-family: inherit;
  }
  .detail-cta .cta-btn:hover { background: #234a1f; }

  /* ─── スクリーンショットビューワー（旧app-detail.htmlより統合） ─── */
  .viewer-section {
    height: 100%;                     /* 詳細の1画面目としてページぴったりに収める */
    background: #16280f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 24px 0;
    overflow: hidden;
  }
  .viewer-area {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    width: 92%;
    max-width: 400px;
  }
  .viewer-wrap {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* スワイプはCSSスクロールスナップに委譲（端で止まる。無限ループは廃止） */
  .screenshot-main {
    width: 100%;
    max-height: 100%;
    aspect-ratio: 9/19.5;
    border-radius: 24px;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.14);
  }
  .screenshot-main::-webkit-scrollbar { display: none; }
  .viewer-track { display: flex; height: 100%; }
  .viewer-slide {
    flex: 0 0 100%;
    width: 100%; height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: #000;
  }
  .viewer-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide-description {
    position: absolute;
    bottom: 16px; left: 14px; right: 14px;
    max-height: 30%; overflow-y: auto;
    background: #1e40af;
    border: 3px solid #ffffff;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px; font-weight: 900; line-height: 1.65;
    color: #FFFF00;
    z-index: 5;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  /* 偶数枚目(2・4・6枚目)の解説ボックス: 白地・赤太枠・黒太字（奇数枚目は上の青地のまま） */
  .slide-description.alt {
    background: #ffffff;
    border: 3px solid #d32f2f;
    color: #1a1a18;
    font-weight: 700;
  }
  .viewer-dots {
    flex: 0 0 auto;
    display: flex; justify-content: center; gap: 8px;
    padding-top: 10px;
  }
  .viewer-dots .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: none; padding: 0; cursor: pointer;
  }
  .viewer-dots .dot.active { background: #fff; }
  .viewer-scroll-hint {
    flex-shrink: 0;
    padding: 10px 0 14px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: rgba(255,255,255,0.7); font-size: 11px;

  /* ─── 詳細・購入セクション（旧app-detail.htmlより統合） ─── */

  /* レビュー */

  @media (max-width: 480px) {

  /* ── PC（広い画面）：ファーストビューを左右2分割でよりインパクトのある配置に ── */

    .hero-carousel-viewport { flex: 0 0 auto; }

<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, query, where, orderBy, getDocs, doc, setDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const pager = document.getElementById('pager');

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function starString(stars) {
    const full = Math.round(stars || 0);
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  function chunkSlides(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  // ── Firestore未設定時のcrossmemo（memo-sync）用フォールバック ──
  // apps/{id}.topImages（トップの2枚組カルーセル）
  const MEMO_SYNC_FALLBACK_IMAGES = [
    'images/hero/img_9266.jpg',
    'images/hero/img_9267.jpg',
    'images/hero/img_9268.jpg',
    'images/hero/img_9271.jpg'
  ];
  // apps/{id}.slides（詳細ビューワーの画像＋解説文）
  const MEMO_SYNC_FALLBACK_SLIDES = [
    { image: 'images/slides/img_9305.jpg', description: '同じURLで同期しているので、片方(PCでもスマホでも)があってもなくても、使いたいときに両方(遅延なく)使えるのが強み。' },
    { image: 'images/slides/img_9272.jpg', description: '朝、起きたら昨夜視聴したYouTube動画をNotebookLMでデータ化して、このアプリでデコレーションするのが私(開発者)の使い方です。' },
    { image: 'images/slides/img_9273.jpg', description: 'スマホAIで調べた内容を気軽に貼り付けられるのも利点です。このアプリのおかげでナノバナナの明確な使い方を決められました。' },
    { image: 'images/slides/kesseki.jpg', description: 'スマホAIで調べた内容にグーグル画像検索で画像を貼り付けた例です。PC側でスクショしてスマホでデコレーションというコラボです。' },
    { image: 'images/slides/gold.jpg', description: 'NotebookLMでの【スタジオ】のコンテンツを組み合わせた方が分かりやすいカードができます。スライド資料も1枚の挿絵となるので理解を深めます。' },
    { image: 'images/slides/img_9277.jpg', description: 'YouTube動画のリンクも貼り付けられ、カード内で再生もできます。意外と秀逸なコンテンツでも「あれ？あの動画はどこに？」と整理できない開発者の私。パネルで整理整頓もいい方法。' },
  ];

  function topImagesFor(app) {
    if (Array.isArray(app.topImages) && app.topImages.length) return app.topImages;
    if (app.id === 'memo-sync') return MEMO_SYNC_FALLBACK_IMAGES;
    return [];
  }

  function slidesFor(app) {
    if (Array.isArray(app.slides) && app.slides.length) return app.slides;
    if (app.id === 'memo-sync') return MEMO_SYNC_FALLBACK_SLIDES;
    return [];
  }

  // 表示中のバージョン確認用（反映トラブル調査時にフッター右下の表記を見る）
  const BUILD_TAG = 'v2026-07-06c';

  const FOOTER_HTML = `
    <footer>
      <a href="waitlist.html" class="waitlist-link"><span class="waitlist-icon">📣</span>次回作の情報を受け取る</a>
      <a href="contact.html">開発者への問合せ</a>
      <br><br>
      © 2026 100均アプリ — siro
      <a class="admin-link" href="admin/login.html">管理者</a>
      <span style="color: rgba(184,217,178,0.35); font-size: 10px; margin-left: 6px;">${BUILD_TAG}</span>
    </footer>`;

  function heroCarouselHtml(images, app) {
    if (!images.length) {
      return `
        <div class="hero-carousel">
          <div class="hero-noimage">${escapeHtml(app.icon || '📦')}</div>
        </div>`;
    }
    const pages = chunkSlides(images, 2);
    return `
      <div class="hero-carousel">
        <div class="hero-carousel-viewport">
          <div class="hero-carousel-track">
            ${pages.map((pair, j) => `
              <div class="hero-carousel-page">
                ${pair.map(src => `<img class="hero-screenshot" src="${escapeHtml(src)}" alt="スクリーンショット"${j === 0 ? '' : ' loading="lazy"'}>`).join('')}
              </div>`).join('')}
          </div>
        </div>
        ${pages.length > 1 ? `
          <div class="hero-dots">
            ${pages.map((_, j) => `<button class="dot${j === 0 ? ' active' : ''}" type="button" data-dot="${j}" aria-label="スクリーンショット${j + 1}ページ目"></button>`).join('')}
          </div>` : ''}
      </div>`;
  }

  function viewerSectionHtml(slides) {
    if (!slides.length) return '';
    return `
      <section class="viewer-section">
        <div class="viewer-area">
          <div class="viewer-wrap">
            <div class="screenshot-main">
              <div class="viewer-track">
                ${slides.map((s, j) => `
                  <div class="viewer-slide"><img src="${escapeHtml(s.image)}" alt="スクリーンショット${j + 1}"${j === 0 ? '' : ' loading="lazy"'}></div>`).join('')}
              </div>
            </div>
            <div class="slide-description">${escapeHtml(slides[0].description || '')}</div>
          </div>
          ${slides.length > 1 ? `
            <div class="viewer-dots">
              ${slides.map((_, j) => `<button class="dot${j === 0 ? ' active' : ''}" type="button" data-dot="${j}" aria-label="スクリーンショット${j + 1}枚目"></button>`).join('')}
            </div>` : ''}
          <div class="viewer-scroll-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span>詳細・購入へ</span>
          </div>
        </div>
      </section>`;
  }

  function detailSectionsHtml(app, reviews) {
    const avg = reviews.length
      ? (reviews.reduce((s, r) => s + (r.rating || 0), 0) / reviews.length).toFixed(1)
      : null;
    return `
      <div class="section-divider">詳 細 ・ 購 入</div>
      <section class="detail-section">
        <p class="app-name">${escapeHtml(app.name || '')}</p>
        <p class="app-catch">${escapeHtml((app.catchWords || []).join(''))}</p>
        <div class="stars-row">
          <span class="stars">${starString(app.stars)}</span>
          <span class="review-link">${reviews.length}件のレビュー</span>
        </div>
        <div class="purchase-box">
          <p class="price">¥${escapeHtml(app.price ?? '')}<br><span>（買い切り）</span></p>
          <a class="btn btn-primary" href="${escapeHtml(app.stripeLink || 'javascript:void(0)')}" target="_blank">購入してログイン</a>
          <a class="btn btn-secondary" href="${escapeHtml(app.guestLink || 'javascript:void(0)')}">ゲストで試してみる</a>
          <div class="purchased-help-link">
            購入済みなのに使えない方は<a href="https://crossmemo.web.app/?payment=success" target="_blank" rel="noopener">こちらから</a>
          </div>
          <div class="contact-link">
            <a class="review-post-link">アプリのレビューを投稿する ↓</a>
          </div>
        </div>
        <div class="reviews-block">
          <div class="section-title-row">
            <span class="section-title">カスタマーレビュー</span>
            ${avg ? `<span class="review-summary">★${avg} / ${reviews.length}件</span>` : ''}
          </div>
          <div class="review-list"></div>
          ${reviews.length > 3 ? '<a class="view-all-btn">すべてのレビューを見る →</a>' : ''}
        </div>
      </section>
      ${reviews.length > 3 ? `
        <div class="section-divider">全 て の レ ビ ュ ー</div>
        <section class="detail-section all-reviews">
          <div class="section-title-row">
            <span class="section-title">すべてのレビュー</span>
            <span class="review-summary">${reviews.length}件</span>
          </div>
          <div class="all-review-list"></div>
        </section>` : ''}
    `;
  }

  function appPageHtml(app, reviews, slides, i) {
    const catchText = (app.catchWords || []).join('');
    const features = app.features || [];
    return `
      <section class="hero">
        <div class="hero-text-block">
          <p class="hero-title"><span class="line1">${i + 1}作目</span><span class="line2">${escapeHtml(app.name || '')}</span></p>
          ${catchText ? `<p class="hero-catchbox">${escapeHtml(catchText)}</p>` : ''}
        </div>
        ${heroCarouselHtml(topImagesFor(app), app)}
        <div class="hero-ctas">
          <a class="hero-btn guest" href="${escapeHtml(app.guestLink || 'javascript:void(0)')}">ゲストで試す</a>
          <a class="hero-btn purchase" href="${escapeHtml(app.stripeLink || 'javascript:void(0)')}" target="_blank">購入する</a>
        </div>
        <a class="scroll-hint" href="javascript:void(0)">
          <span>特徴を見る</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </a>
      </section>

      <div class="intro-scroll">
        <section class="features-section">
          <div class="section-label-wrap"><p class="section-label">開発の動機</p></div>
          ${features.map((f, j) => `
            <div class="feature-item">
              <div class="mark">${j + 1}</div>
              <p class="feature-text">${escapeHtml(f)}</p>
            </div>
          `).join('')}
          <div class="sync-note">このアプリはインストールの手間がない身軽で、ブラウザと同じ安全性の仕組みで守られているPWAアプリです</div>
          <p class="privacy-caution">リスクは0ではないです。メモの中には個人情報は入れないようにしてください。情報の紛失・漏洩について、開発者は責任を負いかねます。</p>
        </section>

        <section class="detail-cta">
          <p class="price-line">¥${escapeHtml(app.price ?? '')} <span>${escapeHtml(app.priceNote || '')}</span></p>
          <button class="cta-btn detail-jump" type="button">もっと詳しく見ましょう →</button>
        </section>
      </div>
    `;
  }

  function detailModalHtml(app, reviews, slides) {
    return `
      <button class="modal-close" type="button" aria-label="詳細を閉じる">✕</button>
      <div class="modal-scroll">
        ${viewerSectionHtml(slides)}
        ${detailSectionsHtml(app, reviews)}
        ${FOOTER_HTML}
      </div>`;
  }

  function comingSoonHtml(nextNumber) {
    return `
      <div class="coming-soon-body">
        <div class="coming-soon-box">
          <p class="big">近日公開</p>
          <p>${nextNumber}作目を制作中です。<br>お楽しみに！</p>
        </div>
      </div>
      ${FOOTER_HTML}`;
  }

  function buildReviewCard(r) {
    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <div class="review-header">
        <div class="avatar"></div>
        <div><p class="reviewer"></p><p class="review-meta"></p></div>
      </div>
      <div class="review-stars"></div>
      <p class="review-text"></p>
    `;
    const dateText = (r.createdAt && typeof r.createdAt.toDate === 'function')
      ? r.createdAt.toDate().toLocaleDateString('ja-JP') : '';
    card.querySelector('.avatar').textContent = (r.name || '?').charAt(0);
    card.querySelector('.reviewer').textContent = r.name || '';
    card.querySelector('.review-meta').textContent = dateText;
    card.querySelector('.review-stars').textContent = starString(r.rating);
    card.querySelector('.review-text').textContent = r.comment || '';
    return card;
  }

  // 横スクロールスナップのドット追従＋ドットクリック移動（汎用）
  function initSnapDots(container, dots) {
    if (!container || !dots.length) return () => {};
    dots.forEach(dot => dot.addEventListener('click', () => {
      container.scrollTo({ left: Number(dot.dataset.dot) * container.clientWidth, behavior: 'smooth' });
    }));
    let raf = null;
    let onChange = () => {};
    container.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const idx = Math.round(container.scrollLeft / container.clientWidth);
        dots.forEach((d, j) => d.classList.toggle('active', j === idx));
        onChange(idx);
      });
    }, { passive: true });
    return cb => { onChange = cb; };
  }

  function initAppPage(page, idx) {
    // 特徴の出現アニメーション
    const items = page.querySelectorAll('.feature-item');
    if (items.length) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.3 });
      items.forEach(item => observer.observe(item));
    }

    // ヒーローの「特徴を見る」ヒント
    const hint = page.querySelector('.scroll-hint');
    const featuresEl = page.querySelector('.features-section');
    if (hint && featuresEl) {
      hint.addEventListener('click', e => {
        e.preventDefault();
        featuresEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    // ヒーローカルーセル（ドットのみJS）
    initSnapDots(
      page.querySelector('.hero-carousel-viewport'),
      [...page.querySelectorAll('.hero-dots .dot')]
    );

    // 「もっと詳しく見ましょう→」→ 詳細モーダルを開く
    page.querySelector('.detail-jump')?.addEventListener('click', () => openDetail(idx));
  }

  function initDetailModal(modal, { reviews, slides }) {
    // ビューワー（ドット＋解説文の切り替え）
    const setViewerChange = initSnapDots(
      modal.querySelector('.screenshot-main'),
      [...modal.querySelectorAll('.viewer-dots .dot')]
    );
    const label = modal.querySelector('.slide-description');
    if (label && slides.length) {
      setViewerChange(idx => {
        const i = Math.max(0, Math.min(idx, slides.length - 1));
        label.textContent = slides[i].description || '';
        label.classList.toggle('alt', i % 2 === 1);   // 2・4・6枚目(index 1,3,5)のみ白地赤枠
      });
    }

    // 「詳細・購入へ」ヒント → モーダル内をスクロール
    modal.querySelector('.viewer-scroll-hint')?.addEventListener('click', () => {
      modal.querySelector('.section-divider')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // レビュー描画とスクロールリンク
    const reviewList = modal.querySelector('.review-list');
    if (reviewList) {
      reviews.slice(0, 3).forEach(r => reviewList.appendChild(buildReviewCard(r)));
    }
    const allList = modal.querySelector('.all-review-list');
    if (allList) {
      reviews.forEach(r => allList.appendChild(buildReviewCard(r)));
    }
    const reviewsBlock = modal.querySelector('.reviews-block');
    const scrollToReviews = () => reviewsBlock?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    modal.querySelector('.review-link')?.addEventListener('click', scrollToReviews);
    modal.querySelector('.review-post-link')?.addEventListener('click', () => {
      location.href = `review.html?app=${encodeURIComponent(modal.dataset.appId)}`;
    });
    modal.querySelector('.view-all-btn')?.addEventListener('click', () => {
      modal.querySelector('.all-reviews')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // 閉じるボタン
    modal.querySelector('.modal-close').addEventListener('click', () => closeDetail());
  }

  // ── URLハッシュ（#<appId> / #<appId>/detail）とモーダル開閉 ──
  let pagesRef = [];
  let modalsRef = [];
  let currentIdx = 0;
  let openIdx = null;        // 開いている詳細モーダルのindex（null=閉）
  let openedViaPush = false; // pushStateで開いたか（✕で閉じるときhistory.back()する）

  function openDetail(idx, { push = true } = {}) {
    const modal = modalsRef[idx];
    if (!modal || openIdx === idx) return;
    if (openIdx !== null) modalsRef[openIdx].classList.remove('open');
    openIdx = idx;
    modal.querySelector('.modal-scroll').scrollTop = 0;   // 常に先頭（ビューワー）から
    modal.classList.add('open');
    document.body.classList.add('modal-open');            // トップバーの表示切替(来店者数→戻りヒント)
    document.querySelector('header h1').textContent = '詳細ページ';
    const id = modal.dataset.appId;
    if (push) {
      history.pushState({ detail: id }, '', '#' + id + '/detail');
      openedViaPush = true;
    } else {
      history.replaceState(null, '', '#' + id + '/detail');
      openedViaPush = false;
    }
  }

  function closeDetail({ fromPop = false } = {}) {
    if (openIdx === null) return;
    const modal = modalsRef[openIdx];
    modal.classList.remove('open');
    document.body.classList.remove('modal-open');
    document.querySelector('header h1').textContent = '100均アプリ';
    const id = modal.dataset.appId;
    openIdx = null;
    if (fromPop) return;                       // 戻る操作由来: 履歴は処理済み
    if (openedViaPush) {
      openedViaPush = false;
      history.back();                          // pushした分を戻す（popstateは開いていないので無視される）
    } else {
      history.replaceState(null, '', '#' + id);
    }
  }

  // iOSの戻るジェスチャー／ブラウザバックでモーダルを閉じる
  window.addEventListener('popstate', () => {
    if (openIdx !== null) closeDetail({ fromPop: true });
  });

  function computeHash() {
    const id = pagesRef[currentIdx]?.dataset.appId;
    return id ? '#' + id : '';
  }

  let hashRaf = null;
  function scheduleHashUpdate() {
    if (hashRaf) return;
    hashRaf = requestAnimationFrame(() => {
      hashRaf = null;
      if (openIdx !== null) return;            // モーダル表示中は/detailハッシュを維持
      const h = computeHash();
      if (h && h !== location.hash) history.replaceState(null, '', h);
    });
  }

  function applyHash() {
    const raw = decodeURIComponent(location.hash.slice(1));
    if (!raw) return;
    const [appId, sub] = raw.split('/');
    const idx = pagesRef.findIndex(p => p.dataset.appId === appId);
    if (idx < 0) return;
    currentIdx = idx;
    if (idx > 0) pager.scrollTo({ left: idx * pager.clientWidth });
    if (sub === 'detail' && modalsRef[idx]) openDetail(idx, { push: false });
  }

  function initPagerNav() {
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function updateArrows() {
      prevBtn.classList.toggle('hidden', currentIdx <= 0);
      nextBtn.classList.toggle('hidden', currentIdx >= pagesRef.length - 1);
    }

    // 現在ページの検出（scrollendはiOS Safari未対応のためIntersectionObserverを使う）
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          currentIdx = pagesRef.indexOf(entry.target);
          updateArrows();
          scheduleHashUpdate();
        }
      });
    }, { root: pager, threshold: 0.6 });
    pagesRef.forEach(p => observer.observe(p));

    prevBtn.addEventListener('click', () => {
      pager.scrollTo({ left: Math.max(0, currentIdx - 1) * pager.clientWidth, behavior: 'smooth' });
    });
    nextBtn.addEventListener('click', () => {
      pager.scrollTo({ left: Math.min(pagesRef.length - 1, currentIdx + 1) * pager.clientWidth, behavior: 'smooth' });
    });

    updateArrows();
  }

  function renderPages(items) {
    pager.innerHTML =
      items.map((item, i) => `<section class="app-page" data-app-id="${escapeHtml(item.app.id)}">${appPageHtml(item.app, item.reviews, item.slides, i)}</section>`).join('') +
      `<section class="app-page coming-soon" data-app-id="coming-soon">${comingSoonHtml(items.length + 1)}</section>`;

    pagesRef = [...pager.querySelectorAll('.app-page')];
    items.forEach((item, i) => initAppPage(pagesRef[i], i));

    // 詳細モーダル（アプリごとに1つ、bodyレベルの#modalRootに配置）
    const modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML = items.map(item =>
      `<div class="detail-modal" data-app-id="${escapeHtml(item.app.id)}">${detailModalHtml(item.app, item.reviews, item.slides)}</div>`
    ).join('');
    modalsRef = [...modalRoot.querySelectorAll('.detail-modal')];
    items.forEach((item, i) => initDetailModal(modalsRef[i], item));

    initPagerNav();
    applyHash();
  }

  async function loadApps() {
    try {
      const q = query(collection(db, 'apps'), where('published', '==', true), orderBy('order'));
      const snap = await getDocs(q);
      const apps = [];
      snap.forEach(docSnap => apps.push({ id: docSnap.id, ...docSnap.data() }));

      if (!apps.length) {
        pager.innerHTML = '<section class="app-page"><p style="text-align:center; color:var(--muted); font-size:13px; padding:80px 20px;">公開中のアプリがありません。</p></section>';
        return;
      }

      // 各アプリの承認済みレビューを並列取得
      const reviewSnaps = await Promise.all(
        apps.map(app => getDocs(query(collection(db, 'apps', app.id, 'reviews'), where('approved', '==', true))))
      );
      const items = apps.map((app, i) => {
        const reviews = [];
        reviewSnaps[i].forEach(r => reviews.push(r.data()));
        reviews.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
        return { app, reviews, slides: slidesFor(app) };
      });

      renderPages(items);
    } catch (err) {
      console.error('アプリ一覧の読み込みに失敗しました', err);
      pager.innerHTML = '<section class="app-page"><p style="text-align:center; color:var(--muted); font-size:13px; padding:80px 20px;">読み込みに失敗しました。時間をおいて再度お試しください。</p></section>';
    }
  }

  async function trackVisitor() {
    try {
      const ref = doc(db, 'visitors', 'total');
      // 実際の来店だけをカウントする:
      // - navigator.webdriver … Playwright等の自動ブラウザを除外（検証作業でカウンターを汚さない）
      // - localhost … ローカル開発中のアクセスを除外（firebase-configは本番Firestoreを指しているため）
      // - sessionStorage … 同一セッション（タブを開いてから閉じるまで）内の再訪問・リロードでは加算しない
      const isAutomated = navigator.webdriver === true;
      const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
      if (!isAutomated && !isLocalDev && !sessionStorage.getItem('visitCounted')) {
        await setDoc(ref, { count: increment(1) }, { merge: true });
        sessionStorage.setItem('visitCounted', '1');
      }
      const snap = await getDoc(ref);
      const count = snap.data()?.count ?? 1;
      const el = document.getElementById('visitorCount');
      if (el) el.textContent = `来店者数 ${count.toLocaleString()}`;
    } catch (e) {
      // カウント失敗時は非表示のまま
    }
  }

  // ── ビューポート高さの追従（refitViewport）──
  // アドレスバーの表示/非表示・回転などで実際の画面高さが変わったら、
  // ①--app-height を実測値に更新（下部空白の恒久化を防ぐ）
  // ②詳細を読んでいる最中ならドック位置(最下端)を維持
  // ③横ページャの位置を現在ページに合わせ直す
  // 同期処理・値比較ベース。
  // ⚠️ rAFやフラグでの間引きは絶対に入れないこと: 予約直後にページが凍結
  // (bfcache格納)されるとコールバックが失われてフラグが立ちっぱなしになり、
  // 以後の再計算がすべて無視される＝「外部サイト往復を繰り返すと空白が
  // 恒久化し二度と直らない」バグの原因だった。
  let appliedH = 0, appliedW = 0;
  function refitViewport() {
    const h = window.innerHeight;
    const w = window.innerWidth;
    const want = `${h}px`;
    const current = document.documentElement.style.getPropertyValue('--app-height');
    if (h === appliedH && w === appliedW && current === want) return;   // 変化なし
    appliedH = h;
    appliedW = w;
    document.documentElement.style.setProperty('--app-height', want);
    if (pagesRef.length) pager.scrollTo({ left: currentIdx * pager.clientWidth });
  }
  window.addEventListener('resize', refitViewport, { passive: true });
  window.visualViewport?.addEventListener('resize', refitViewport, { passive: true });
  // 外部サイト（ゲスト/購入）から「戻る」で復帰したとき（bfcache復帰を含む）は
  // resize が発火しないことがあり、出発時とビューポート高さが違うと下部に
  // 空白が残り続ける。表示復帰系イベントでも再計算する。
  // iOSはアドレスバーの高さ確定が復帰より遅れることがあるため追い打ちも入れる。
  const refitOnReturn = () => {
    refitViewport();
    setTimeout(refitViewport, 250);
    setTimeout(refitViewport, 800);
  };
  window.addEventListener('pageshow', refitOnReturn);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refitOnReturn();
  });
  // ウォッチドッグ: どの復帰イベントを取りこぼしても最大1.2秒で自己修復する保険。
  // 値が変わっていなければ何もしないので負荷は無視できる
  setInterval(refitViewport, 1200);
  refitViewport();

  // トップバーの「100均アプリ」バッジをダブルタップ（ダブルクリック）で
  // 現在のアプリの紹介ページ先頭までスムーズにスナップスクロールして戻る
  const logo = document.querySelector('header h1');
  let lastLogoTap = 0;
  logo.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastLogoTap < 400) {
      lastLogoTap = 0;
      if (openIdx !== null) closeDetail();   // 詳細モーダルが開いていれば閉じる
      pagesRef[currentIdx]?.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      lastLogoTap = now;
    }
  });

  // ── PWAホーム画面追加の案内モーダル ──
  // Safari実ブラウザで、まだホーム画面から起動していない場合のみ、
  // 読み込みから3秒後に1回だけ表示する（localStorageで既読を記録）。
  function isSafariBrowser() {
    const ua = navigator.userAgent;
    // Chrome/Android/CriOS(iOS Chrome)/FxiOS(iOS Firefox)/EdgiOS/OPiOS は
    // すべてUAに"Safari"を含むため除外した上で判定する
    return /^((?!chrome|android|crios|fxios|edgios|opios).)*safari/i.test(ua);
  }
  function isStandaloneMode() {
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }
  function initPwaGuide() {
    if (!isSafariBrowser() || isStandaloneMode()) return;
    if (localStorage.getItem('pwa-guide-shown')) return;
    setTimeout(() => {
      document.getElementById('pwaGuideOverlay')?.classList.add('open');
    }, 3000);
  }
  document.getElementById('pwaGuideOkBtn')?.addEventListener('click', () => {
    localStorage.setItem('pwa-guide-shown', '1');
    document.getElementById('pwaGuideOverlay')?.classList.remove('open');
  });
  initPwaGuide();

  trackVisitor();
  loadApps();
</script>

</body>
</html>
