<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一斉メール送信 — 100均アプリ 管理画面</title>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --primary: #2d5a27;
    --accent: #e8a020;
    --text: #1a1a18;
    --muted: #6b6b66;
    --border: #e0ddd6;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; padding-top: 52px; }

  header {
    background: var(--primary);
    padding: 0 24px;
    height: 52px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px;
  }
  header h1 {
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.06em;
    border: 2px solid #fff; padding: 3px 12px; border-radius: 6px; white-space: nowrap;
  }
  header .badge { color: var(--accent); font-size: 12px; font-weight: 700; }
  header .mobile-admin-label { display: none; }
  header nav { margin-left: auto; display: flex; gap: 18px; }
  header nav a { color: #b8d9b2; font-size: 13px; text-decoration: none; }
  header nav a:hover, header nav a.active { color: #fff; }

  footer .mobile-back-link { display: none; }

  /* スマホ表示時のみ: ADMINバッジ→「管理者用画面」表示、ナビ非表示、フッターの著作権表記→「直前の画面に戻す」リンク */
  @media (max-width: 600px) {
    header .badge { display: none; }
    header .mobile-admin-label {
      display: inline; color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    header nav { display: none; }
    footer .desktop-footer-text { display: none; }
    footer .mobile-back-link {
      display: inline-block; color: #ffe033; font-weight: 700; font-size: 14px; text-decoration: none;
    }
  }

  .layout { max-width: 700px; margin: 0 auto; padding: 32px 24px 60px; }

  .page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  .form-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 24px;
  }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .field select, .field input, .field textarea {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 0.5px solid var(--border); border-radius: 8px;
    font-family: inherit; background: var(--bg); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 160px; line-height: 1.6; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .recipient-count {
    display: inline-block; background: var(--bg); border: 0.5px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--primary); font-weight: 700;
  }

  .btn {
    display: inline-block; padding: 12px 28px; border-radius: 8px;
    font-size: 14px; font-weight: 700; text-align: center; cursor: pointer;
    border: none; background: var(--accent); color: #fff;
  }
  .btn:hover { background: #c98910; }
  .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .status-msg { font-size: 13px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .status-msg.show { display: block; }
  .status-msg.success { background: #e8f5e4; color: var(--primary); border: 0.5px solid #b8d9b2; }
  .status-msg.error { background: #fdecec; color: #b3261e; border: 0.5px solid #f2c4c0; }

  footer { background: var(--primary); color: #b8d9b2; text-align: center; padding: 20px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>100均アプリ</h1>
  <span class="badge">ADMIN</span>
  <span class="mobile-admin-label">管理者用画面</span>
  <nav>
    <a href="dashboard.html">ダッシュボード</a>
    <a href="inquiries.html">問い合わせ</a>
    <a href="mail-send.html" class="active">一斉メール</a>
    <a href="../index.html">サイトを見る</a>
    <a href="#" id="logoutLink">ログアウト</a>
  </nav>
</header>

<div class="layout" id="layout" style="display:none;">

  <p class="page-title">一斉メール送信</p>
  <p class="page-sub">ウェイティングリスト登録者のメールアドレスへ一括で通知を送ります</p>

  <div class="form-card">
    <form id="mailForm">
      <div class="field">
        <label>送信先</label>
        <p class="hint">ウェイティングリスト登録者 全員: <span class="recipient-count" id="recipientCount">読み込み中…</span></p>
      </div>

      <div class="field">
        <label>件名</label>
        <input type="text" id="subject" placeholder="例：新アプリ「糖尿人のカウンター」公開のお知らせ" required>
      </div>

      <div class="field">
        <label>本文</label>
        <textarea id="body" placeholder="本文を入力してください" required></textarea>
        <p class="hint">送信元: kimijimasan@gmail.com（Firebase Functions + SendGrid経由）</p>
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:16px; cursor:pointer; color:var(--text);">
        <input type="checkbox" id="testMode" checked style="width:auto; margin:0;">
        テスト送信（専用窓口だけに送る: apps100kin@gmail.com）
      </label>
      <p style="font-size:11px; color:var(--muted); margin:-10px 0 16px;">
        ※ チェックを外すと、ウェイティングリスト登録者<strong>全員</strong>に送信されます。
      </p>

      <button type="submit" class="btn" id="sendBtn">この内容で送信する</button>
      <div class="status-msg success" id="statusMsg"></div>
    </form>
  </div>

</div>

<footer>
  <span class="desktop-footer-text">© 2026 100均アプリ — siro（管理画面）</span>
  <a class="mobile-back-link" href="../index.html#memo-sync/detail">直前の画面に戻す</a>
</footer>

<script type="module">
  import { app, auth, db } from "../firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";
  import { collection, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const ADMIN_EMAIL = "kimijimasan@gmail.com";
  const TEST_RECIPIENT_EMAIL = "apps100kin@gmail.com";
  const functions = getFunctions(app, "asia-northeast1");
  const sendBulkMail = httpsCallable(functions, "sendBulkMail");
  const recipientCount = document.getElementById('recipientCount');

  // ウェイティングリストの登録件数を取得して表示（管理者認証が必要なので認証後に呼ぶ）
  async function loadRecipientCount() {
    try {
      const snap = await getCountFromServer(collection(db, 'waitlist'));
      const n = snap.data().count;
      recipientCount.textContent = n + '件';
      recipientCount.dataset.count = n;
    } catch (e) {
      recipientCount.textContent = '取得失敗';
    }
  }

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut(auth);
    location.href = 'login.html';
  });

  onAuthStateChanged(auth, (user) => {
    if (!user || user.email !== ADMIN_EMAIL) {
      location.href = 'login.html';
      return;
    }
    document.getElementById('layout').style.display = '';
    loadRecipientCount();
  });

  document.getElementById('mailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('statusMsg');
    const btn = document.getElementById('sendBtn');
    const subject = document.getElementById('subject').value.trim();
    const body = document.getElementById('body').value.trim();
    const testMode = document.getElementById('testMode').checked;

    // 本番送信（全員）は誤送信防止の確認を挟む
    if (!testMode) {
      const cnt = recipientCount.dataset.count ?? '?';
      if (!confirm(`ウェイティングリスト登録者 ${cnt}件 全員に送信します。よろしいですか？`)) return;
    }

    status.className = 'status-msg';
    btn.disabled = true;
    btn.textContent = '送信中…';
    try {
      const res = await sendBulkMail({ subject, body, test: testMode });
      status.textContent = res.data.test
        ? `テスト送信しました（${TEST_RECIPIENT_EMAIL} 宛 ${res.data.sent}件）。受信トレイをご確認ください。`
        : `送信しました（ウェイティングリスト登録者 ${res.data.sent}件）。`;
      status.classList.add('success', 'show');
    } catch (err) {
      status.textContent = `送信に失敗しました: ${err.message || err}`;
      status.classList.add('error', 'show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'この内容で送信する';
    }
  });
</script>

</body>
</html>
