<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問い合わせ一覧 — 100均アプリ 管理画面</title>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --primary: #2d5a27;
    --accent: #e8a020;
    --text: #1a1a18;
    --muted: #6b6b66;
    --border: #e0ddd6;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; padding-top: 52px; }

  header {
    background: var(--primary);
    padding: 0 24px;
    height: 52px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px;
  }
  header h1 {
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.06em;
    border: 2px solid #fff; padding: 3px 12px; border-radius: 6px; white-space: nowrap;
  }
  header .badge { color: var(--accent); font-size: 12px; font-weight: 700; }
  header .mobile-admin-label { display: none; }
  header nav { margin-left: auto; display: flex; gap: 18px; }
  header nav a { color: #b8d9b2; font-size: 13px; text-decoration: none; }
  header nav a:hover, header nav a.active { color: #fff; }

  footer .mobile-back-link { display: none; }

  /* スマホ表示時のみ: ADMINバッジ→「管理者用画面」表示、ナビ非表示、フッターの著作権表記→「直前の画面に戻す」リンク */
  @media (max-width: 600px) {
    header .badge { display: none; }
    header .mobile-admin-label {
      display: inline; color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    header nav { display: none; }
    footer .desktop-footer-text { display: none; }
    footer .mobile-back-link {
      display: inline-block; color: #ffe033; font-weight: 700; font-size: 14px; text-decoration: none;
    }
  }

  .layout { max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }

  .page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-btn {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .inquiry-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .inquiry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .inquiry-subject { font-size: 14px; font-weight: 700; }
  .inquiry-meta { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .inquiry-from { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .inquiry-body { font-size: 13px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
  .inquiry-actions { margin-top: 10px; }
  .inquiry-actions a {
    font-size: 12px; color: var(--primary); text-decoration: none; margin-right: 14px;
  }
  .inquiry-actions a:hover { text-decoration: underline; }

  .section-title {
    font-size: 13px; font-weight: 700; color: var(--primary);
    letter-spacing: 0.1em; padding-bottom: 6px;
    border-bottom: 2px solid var(--primary); margin: 40px 0 16px;
  }

  .review-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .review-card.pending-review { opacity: 0.7; }
  .review-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .review-stars { color: var(--accent); font-size: 14px; }
  .review-user { font-size: 13px; font-weight: 700; }
  .review-app { font-size: 11px; color: var(--muted); }
  .review-meta { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .flag-badge {
    background: #fbe3e0; color: #b5392f; font-size: 11px; font-weight: 700;
    border-radius: 6px; padding: 2px 8px;
  }
  .pending-badge {
    background: #fdf6e8; color: #7a5c10; font-size: 11px; font-weight: 700;
    border: 0.5px solid #e8c878; border-radius: 6px; padding: 2px 8px;
  }
  .review-comment { font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
  .review-actions { display: flex; gap: 8px; }
  .review-actions button {
    font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 0.5px solid var(--border); background: var(--bg); color: var(--text);
  }
  .review-actions button.btn-approve { color: var(--primary); border-color: #b8d9b2; background: #e8f5e4; }
  .review-actions button.btn-unapprove { color: #7a5c10; border-color: #e8c878; background: #fdf6e8; }
  .review-actions button.btn-delete { color: #b5392f; border-color: #f0bdb6; background: #fbe3e0; }

  footer { background: var(--primary); color: #b8d9b2; text-align: center; padding: 20px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>100均アプリ</h1>
  <span class="badge">ADMIN</span>
  <span class="mobile-admin-label">管理者用画面</span>
  <nav>
    <a href="dashboard.html">ダッシュボード</a>
    <a href="inquiries.html" class="active">問い合わせ</a>
    <a href="mail-send.html">一斉メール</a>
    <a href="../index.html">サイトを見る</a>
    <a href="#" id="logoutLink">ログアウト</a>
  </nav>
</header>

<div class="layout" id="layout" style="display:none;">

  <p class="page-title">問い合わせ一覧</p>
  <p class="page-sub">サイトの問い合わせフォームから届いたメッセージを新着順に表示しています</p>

  <div id="inquiryList"></div>

  <p class="section-title">レビュー管理</p>
  <p class="page-sub">サイトから投稿されたレビューは未承認のまま届きます。内容を確認し、問題なければ「承認する」を押すと公開されます。星1〜2のレビューには「要確認」バッジが自動表示されます。</p>

  <div class="filter-row">
    <div class="filter-btn active" data-review-filter="all">すべて</div>
    <div class="filter-btn" data-review-filter="pending">承認待ちのみ</div>
    <div class="filter-btn" data-review-filter="flagged">要確認のみ</div>
  </div>

  <div id="reviewList"></div>

</div>

<footer>
  <span class="desktop-footer-text">© 2026 100均アプリ — siro（管理画面）</span>
  <a class="mobile-back-link" href="../index.html#memo-sync/detail">直前の画面に戻す</a>
</footer>

<script type="module">
  import { auth, db } from "../firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    collection, query, orderBy, getDocs, collectionGroup,
    doc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const ADMIN_EMAIL = "kimijimasan@gmail.com";

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut(auth);
    location.href = 'login.html';
  });

  onAuthStateChanged(auth, (user) => {
    if (!user || user.email !== ADMIN_EMAIL) {
      location.href = 'login.html';
      return;
    }
    document.getElementById('layout').style.display = '';
    loadInquiries();
    loadReviews();
  });

  // --- 問い合わせ一覧 ---
  let inquiries = [];
  const listEl = document.getElementById('inquiryList');

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function formatDate(ts) {
    if (!ts || typeof ts.toDate !== 'function') return '';
    return ts.toDate().toLocaleString('ja-JP');
  }

  function renderInquiries() {
    listEl.innerHTML = inquiries.map(i => `
      <div class="inquiry-card">
        <div class="inquiry-head">
          <span class="inquiry-subject">${esc(i.name) || '(お名前未記入)'}</span>
          <span class="inquiry-meta">${esc(formatDate(i.createdAt))}</span>
        </div>
        <p class="inquiry-from">${esc(i.email)}</p>
        <p class="inquiry-body">${esc(i.message)}</p>
        <div class="inquiry-actions">
          <a href="mailto:${esc(i.email)}?subject=${encodeURIComponent('Re: 100均アプリへのお問い合わせ')}">返信する</a>
        </div>
      </div>
    `).join('') || '<p class="page-sub">問い合わせはまだありません</p>';
  }

  async function loadInquiries() {
    try {
      const snap = await getDocs(query(collection(db, 'inquiries'), orderBy('createdAt', 'desc')));
      inquiries = snap.docs.map(d => d.data());
      renderInquiries();
    } catch (err) {
      console.error('問い合わせの読み込みに失敗しました', err);
      listEl.innerHTML = '<p class="page-sub">読み込みに失敗しました</p>';
    }
  }

  // --- レビュー管理 ---
  let reviews = [];
  const reviewListEl = document.getElementById('reviewList');
  let reviewFilter = 'all';

  function starString(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  function renderReviews() {
    let items = reviews;
    if (reviewFilter === 'flagged') {
      items = reviews.filter(r => r.rating <= 2);
    } else if (reviewFilter === 'pending') {
      items = reviews.filter(r => !r.approved);
    }

    reviewListEl.innerHTML = items.map(r => {
      const flagged = r.rating <= 2;
      return `
      <div class="review-card ${!r.approved ? 'pending-review' : ''}">
        <div class="review-head">
          <span class="review-stars">${starString(r.rating)}</span>
          <span class="review-user">${esc(r.name)}</span>
          <span class="review-app">／ ${esc(r.appName)}</span>
          ${flagged ? '<span class="flag-badge">要確認</span>' : ''}
          ${!r.approved ? '<span class="pending-badge">承認待ち</span>' : ''}
          <span class="review-meta">${esc(formatDate(r.createdAt))}</span>
        </div>
        <p class="review-comment">${esc(r.comment)}</p>
        <div class="review-actions">
          ${!r.approved
            ? `<button class="btn-approve" data-action="approve" data-app="${r.appId}" data-id="${r.id}">承認する</button>`
            : `<button class="btn-unapprove" data-action="unapprove" data-app="${r.appId}" data-id="${r.id}">取り下げる</button>`}
          <button class="btn-delete" data-action="delete" data-app="${r.appId}" data-id="${r.id}">削除する</button>
        </div>
      </div>
      `;
    }).join('') || '<p class="page-sub">該当するレビューはありません</p>';
  }

  reviewListEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const { action, app: appId, id } = btn.dataset;
    const ref = doc(db, 'apps', appId, 'reviews', id);

    try {
      if (action === 'approve') {
        await updateDoc(ref, { approved: true });
        reviews.find(r => r.appId === appId && r.id === id).approved = true;
      } else if (action === 'unapprove') {
        await updateDoc(ref, { approved: false });
        reviews.find(r => r.appId === appId && r.id === id).approved = false;
      } else if (action === 'delete') {
        if (!confirm('このレビューを削除します。削除すると復元できません。よろしいですか？')) return;
        await deleteDoc(ref);
        reviews = reviews.filter(r => !(r.appId === appId && r.id === id));
      }
      renderReviews();
    } catch (err) {
      console.error('レビュー操作に失敗しました', err);
      alert('操作に失敗しました。時間をおいて再度お試しください。');
    }
  });

  async function loadReviews() {
    try {
      const [appsSnap, reviewsSnap] = await Promise.all([
        getDocs(collection(db, 'apps')),
        getDocs(collectionGroup(db, 'reviews'))
      ]);
      const appNames = {};
      appsSnap.forEach(d => { appNames[d.id] = d.data().name; });

      reviews = reviewsSnap.docs.map(d => {
        const appId = d.ref.parent.parent.id;
        return { id: d.id, appId, appName: appNames[appId] || appId, ...d.data() };
      });
      renderReviews();
    } catch (err) {
      console.error('レビューの読み込みに失敗しました', err);
      reviewListEl.innerHTML = '<p class="page-sub">読み込みに失敗しました</p>';
    }
  }

  document.querySelectorAll('.filter-btn[data-review-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn[data-review-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      reviewFilter = btn.dataset.reviewFilter;
      renderReviews();
    });
  });

</script>

</body>
</html>
